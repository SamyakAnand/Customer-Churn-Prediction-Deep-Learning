name: Python checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile application and tests
        run: python -m compileall -q app.py prediction_utils.py tests

      - name: Run dependency-free regression tests
        run: python -m unittest discover -s tests -v
